<script>
  // (cross-origin isolation, coi.js: the voices' model runs on several cores. The first visit registers
  // it and reloads once it's in charge; once only a session, in case a browser won't have it.)
  if (!self.crossOriginIsolated && 'serviceWorker' in navigator && self.isSecureContext) {
    let tried = false;
    try { tried = sessionStorage.getItem('bm.coi') === '1'; sessionStorage.setItem('bm.coi', '1'); } catch (e) { tried = true; }
    navigator.serviceWorker.register('coi.js').then((reg) => {
      if (tried || (navigator.serviceWorker.controller && !reg.installing && !reg.waiting)) return;
      if (navigator.serviceWorker.controller) location.reload();
      else navigator.serviceWorker.addEventListener('controllerchange', () => location.reload(), { once: true });
    }).catch(() => {});
  }
</script>

<script>
  // The renderer (engine.js), chosen before any module loads, since each runs on its own three.js:
  // WebGPU (three r187's WebGPURenderer, the custom shaders in TSL) where the browser has it, else
  // WebGL (three r170, the shaders in GLSL). ?renderer=webgl|webgpu, else Settings (bm.renderer:
  // auto, webgpu, webgl). 'auto' takes WebGPU on a computer; a phone keeps WebGL unless asked. A
  // WebGPU start that fails sets bm.nogpu and comes back here as WebGL for the rest of the session.
  (() => {
    let want = new URLSearchParams(location.search).get('renderer'), failed = false;
    try { want ||= localStorage.getItem('bm.renderer'); failed = sessionStorage.getItem('bm.nogpu') === '1'; } catch (e) { /* no storage */ }
    const touch = matchMedia('(pointer: coarse)').matches;
    const R = navigator.gpu && !failed && (want === 'webgpu' || ((!want || want === 'auto') && !touch)) ? 'webgpu' : 'webgl';
    window.BM_RENDERER = R;
    const cdn = 'https://cdn.jsdelivr.net/npm/three@', b = cdn + '0.187.0/build/';
    // (r187's builds import one another by relative path: those are sent to the minified copies)
    const imports = R === 'webgpu'
      ? { three: b + 'three.webgpu.min.js', 'three/webgpu': b + 'three.webgpu.min.js', 'three/tsl': b + 'three.tsl.min.js',
          'three/addons/': cdn + '0.187.0/examples/jsm/', [b + 'three.core.js']: b + 'three.core.min.js',
          [b + 'three.webgpu.js']: b + 'three.webgpu.min.js', [b + 'three.tsl.js']: b + 'three.tsl.min.js' }
      : { three: cdn + '0.170.0/build/three.module.min.js', 'three/addons/': cdn + '0.170.0/examples/jsm/' };
    const map = document.createElement('script');
    map.type = 'importmap';
    map.textContent = JSON.stringify({ imports });
    document.currentScript.after(map);
  })();
</script>

  .bossbar div { position: relative; height: 12px; background: #1a0c0c; border: 2px solid #6a3a2a; box-shadow: 0 0 0 1px #000, 0 0 12px rgba(200, 30, 10, .35), inset 0 0 6px #000; }

  /* ---------------- panels */
  .panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(880px, 94vw); max-height: 88vh; overflow: auto;
           background: var(--panel); border: 2px solid var(--edge); box-shadow: 0 0 0 1px #000, 0 10px 40px #000; padding: 14px 18px 18px; box-sizing: border-box;
           touch-action: pan-y; overscroll-behavior: contain; }

  .panel h3 { margin: 14px 0 8px; font-size: 13px; color: var(--gold); letter-spacing: .12em; text-transform: uppercase; border-bottom: 1px solid #3a3028; padding-bottom: 4px; }
  .panel h3 em { text-transform: none; letter-spacing: 0; color: #8a7a60; font-style: normal; font-size: 12px; }
  .panel .close { position: absolute; right: 10px; top: 8px; width: 34px; height: 34px; font-size: 22px; }
  .grid { display: grid; gap: 8px; }

  .grid.spells { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .grid.gaunts { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }

  .card.on { border-color: var(--gold-dim); background: #1c1610; }

  .card .nm { font-weight: 700; font-size: 13px; }
  .card .ty { font-size: 11px; color: #9a8a6a; }
  .card .ds { font-size: 11px; color: #b8aa90; font-family: Georgia, serif; }
  .hb { display: flex; gap: 6px; margin-top: 6px; }
  .card select.mdl { margin-top: 4px; width: 100%; font: 12px Cinzel, serif; background: #241c18; color: #e8dcc0; border: 1px solid var(--edge); }
  button { font: 700 12px Cinzel, serif; color: #e8dcc0; background: #241c18; border: 1px solid var(--edge); padding: 6px 10px; min-width: 40px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--gold); }
  button.sel { background: #5a4420; border-color: var(--gold); color: #fff4d0; }
  button:disabled { opacity: .25; cursor: default; }
  button.gaunt { font-size: 11px; }

  /* ---------------- the bag (after Velscour's inventory) */
  .panel.bag { width: min(1040px, 97vw); }
  /* the portals' window (portals.js): every other portal, by land; the woken ones to step through to */
  .panel.portals { width: min(880px, 94vw); padding: 18px 22px 16px; background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(70, 110, 220, .2), transparent 70%), linear-gradient(#141420, #0a0a10);
                   border-color: #4a5a8a; box-shadow: 0 0 0 1px #000, 0 0 40px rgba(60, 100, 255, .18), 0 24px 70px rgba(0, 0, 0, .92); }
  .panel.portals h2 { text-align: center; color: #b8ccff; text-shadow: 0 0 14px rgba(90, 140, 255, .55), 0 2px 6px #000; }
  .panel.portals h3 { color: #9ab0e8; border-bottom-color: #2a3050; }
  .p-here { text-align: center; color: #a8a0b8; font-size: 13px; margin-bottom: 4px; } .p-here b { color: #dce6ff; }
  .p-list { display: grid; gap: 6px; grid-template-columns: 1fr 1fr; }   /* (two columns: every portal on one screen) */
  .p-row { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; text-align: left; padding: 7px 12px 7px 8px;
           background: linear-gradient(90deg, rgba(40, 60, 130, .28), rgba(20, 22, 36, .6)); border: 1px solid #36406a; color: #e4e8f8; font: 14px Cinzel, Georgia, serif; }
  button.p-row { cursor: pointer; min-width: 0; }
  button.p-row:hover, button.p-row:focus-visible { border-color: #8aa8ff; background: linear-gradient(90deg, rgba(60, 95, 210, .45), rgba(24, 28, 50, .7)); outline: none; }
  .p-seal { width: 38px; height: 38px; border-radius: 50%; background: url(assets/textures/portal/portal_top.webp) center / cover; box-shadow: 0 0 10px rgba(90, 140, 255, .6); }
  .p-name b { display: block; font-weight: 700; letter-spacing: .03em; } .p-name em { display: block; font: italic 600 12px 'Alegreya Sans', sans-serif; color: #98a4c8; }
  .p-go { font: 700 11px Cinzel, serif; letter-spacing: .16em; text-transform: uppercase; color: #cfdcff; border: 1px solid #5a6eb0; padding: 5px 10px; background: rgba(40, 60, 140, .45); }
  .p-row.locked { background: rgba(16, 16, 22, .7); border-color: #262630; color: #6a6872; }
  .p-row.locked .p-seal { filter: grayscale(1) brightness(.45); box-shadow: none; }
  .p-row.locked .p-name em { color: #5a5866; }
  .p-lock { width: 12px; height: 10px; margin: 6px 6px 0; border: 2px solid #4a4852; border-radius: 2px; position: relative; }
  .p-lock::before { content: ''; position: absolute; left: 1px; top: -9px; width: 6px; height: 7px; border: 2px solid #4a4852; border-bottom: none; border-radius: 5px 5px 0 0; }
  .p-foot { text-align: center; margin-top: 12px; }
  @media (max-width: 620px) { .p-list { grid-template-columns: 1fr; } }   /* (a narrow screen: one column) */
  @media (max-height: 500px) {   /* a phone on its side: three columns of names, every portal on one screen; a woken one is lit and taps to travel */
    .panel.portals { padding: 8px 12px 8px; width: min(800px, 97vw); } .panel.portals h2 { font-size: 17px; margin: 0; } .panel.portals h3 { margin: 6px 0 5px; font-size: 11px; }
    .p-here { font-size: 11px; margin: 0; } .p-list { gap: 4px; grid-template-columns: 1fr 1fr 1fr; }
    .p-row { padding: 3px 6px 3px 4px; gap: 7px; grid-template-columns: 26px 1fr; font-size: 12px; min-height: 34px; } .p-seal { width: 26px; height: 26px; }
    .p-name em, .p-go, .p-lock, .p-foot { display: none; }
  }

               background: radial-gradient(#2a1a10, #0d0805); border: 1px solid var(--edge); }

  .r5 { border-color: #c0203a !important; background: rgba(90, 5, 20, .5) !important; box-shadow: inset 0 0 12px rgba(255, 50, 80, .45); }
  .item-detail { width: 280px; min-height: 120px; border: 1px solid var(--edge); background: rgba(0, 0, 0, .45); padding: 8px; font: 13px Georgia, serif; }
  .item-detail .row, .inv-wrap .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .inv-wrap .row .gold { color: #ffd34a; font-weight: 700; } .dim { color: #9a8a6a; } .small { font-size: 11px; margin-top: 4px; }
  button.small { padding: 5px 9px; font-size: 11px; } button.red { border-color: #7a2a20; }

  /* ---------------- the map */
  .minimap { position: absolute; right: max(16px, env(safe-area-inset-right)); top: 14px; width: 132px; height: 132px; image-rendering: pixelated; opacity: .92; }
  .clock { position: absolute; right: max(16px, env(safe-area-inset-right)); top: 152px; width: 132px; text-align: center; font: 700 17px 'Cinzel', Georgia, serif; letter-spacing: .12em; color: var(--gold); text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.8); pointer-events: none; font-variant-numeric: tabular-nums; }

  /* ---------------- Velscour's Skull by the corner map, the word it asks for, and the Debug Menu (debug.js) */
  .vskull { position: absolute; z-index: 2; pointer-events: auto; right: calc(max(16px, env(safe-area-inset-right)) + 140px); top: 14px; width: 46px; height: 46px;
            display: grid; place-items: center; padding: 3px; min-width: 0; box-sizing: border-box; border: 1px solid #765b38; border-radius: 6px;
            background: linear-gradient(#29180f, #0c0705); box-shadow: 0 0 0 1px #000, 0 2px 6px #000; transition: border-color .2s, box-shadow .2s, transform .1s; }
  .vskull img { display: block; width: 36px; height: 36px; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 0 2px #000); -webkit-user-drag: none; pointer-events: none; }
