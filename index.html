<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellmourn : Castle Velscour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #050307; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #game { image-rendering: pixelated; image-rendering: crisp-edges; }
  #text { pointer-events: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #8a7a9a;
             font: 16px Cinzel, serif; letter-spacing: .2em; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="640" height="360"></canvas>
  <canvas id="text"></canvas>
</div>
<div id="loading">SUMMONING THE CASTLE…</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
