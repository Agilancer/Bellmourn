<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brute Viewer</title>
<style>
  :root { --bg:#0d0f12; --panel:rgba(18,20,24,.88); --line:#2a2e35; --text:#d9d6cf; --dim:#8a877f; --hot:#b3242a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.35 system-ui, sans-serif; overflow:hidden; }
  canvas { display:block; }
  #side { position:fixed; top:12px; left:12px; bottom:12px; width:250px; display:flex; flex-direction:column; gap:8px;
          background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  h1 { font-size:15px; margin:0; letter-spacing:.04em; }
  #stats { color:var(--dim); font-size:12px; }
  #filter { width:100%; padding:6px 8px; background:#0b0c0f; border:1px solid var(--line); color:var(--text); border-radius:6px; }
  #clips { flex:1; overflow:auto; margin:0; padding:0; list-style:none; border-top:1px solid var(--line); }
  #clips li { padding:5px 8px; cursor:pointer; border-radius:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #clips li:hover { background:#1d2027; }
  #clips li.on { background:var(--hot); color:#fff; }
  #clips li small { color:var(--dim); float:right; }
  #clips li.on small { color:#f3d0d0; }
  #bar { position:fixed; left:274px; right:12px; bottom:12px; display:flex; flex-wrap:wrap; align-items:center; gap:10px;
         background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  button { background:#1d2027; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:#4a505a; }
  button.on { background:var(--hot); border-color:var(--hot); color:#fff; }
  label { display:flex; align-items:center; gap:6px; color:var(--dim); }
  select { background:#0b0c0f; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 6px; flex:1; }
  input[type=range] { accent-color:var(--hot); }
  #scrub { flex:1; min-width:140px; }
  #now { min-width:118px; font-variant-numeric:tabular-nums; color:var(--dim); }
  #msg { position:fixed; inset:0; display:grid; place-items:center; color:var(--dim); pointer-events:none; }
  @media (max-width: 720px) {
    #side { top:auto; bottom:64px; left:8px; right:8px; width:auto; height:38vh; }
    #bar { left:8px; right:8px; bottom:8px; }
  }
</style>
</head>
<body>
<div id="msg">Loading brute…</div>
<div id="side">
  <h1>BRUTE — UAL1+2 rig</h1>
  <label>Skin <select id="skin"></select></label>
  <label>Weapon <select id="weapon"><option value="">none</option><option value="Weapon_Maul" selected>maul</option><option value="Weapon_Axe">war axe</option></select></label>
  <div id="stats"></div>
  <input id="filter" placeholder="Filter clips…" autocomplete="off">
  <ul id="clips"></ul>
</div>
<div id="bar">
  <button id="play" title="Space">Pause</button>
  <button id="rest" title="Bind pose">Rest pose</button>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
  <span id="now">0.00 / 0.00 s</span>
  <label>Speed <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1"><span id="sv">1.0×</span></label>
  <button id="spin">Turntable</button>
  <button id="light">Crypt light</button>
  <button id="wire">Wireframe</button>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const SKINS = ['brute_red_demon', 'brute_red_demon_armored'];   // armored: the Fiend set's chest and leg plates
const MODEL = (new URLSearchParams(location.search).get('model') || SKINS[0]) + (/\.glb$/.test(new URLSearchParams(location.search).get('model') || '') ? '' : '.glb');
const $ = (id) => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f12);
scene.fog = new THREE.Fog(0x0d0f12, 9, 22);
const env = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.02, 60);
camera.position.set(1.6, 2.1, 5.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.35, 0);
controls.enableDamping = true;
controls.minDistance = 0.4; controls.maxDistance = 14;

// two lighting moods: a neutral studio, and the game's dim crypt (warm torch key, cold rim)
const hemi = new THREE.HemisphereLight(0xc8cfdc, 0x2a2622, 1.0);
const key = new THREE.DirectionalLight(0xfff1dd, 2.4);
key.position.set(2.6, 4.6, 3.4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -2.5, right: 2.5, top: 3.6, bottom: -0.8, near: 0.5, far: 14 });
const rim = new THREE.DirectionalLight(0xa9c4ff, 1.6);
rim.position.set(-2.2, 2.4, -2.6);
const torch = new THREE.PointLight(0xff8a3a, 0, 6, 1.6);
torch.position.set(1.6, 2.4, 1.7); torch.castShadow = true;
scene.add(hemi, key, rim, torch);

const ground = new THREE.Mesh(new THREE.CircleGeometry(6, 64),
  new THREE.MeshStandardMaterial({ color: 0x1a1b1e, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

let crypt = false;
function setLight() {
  scene.environment = crypt ? null : env;
  hemi.intensity = crypt ? 0.18 : 1.0;
  key.intensity = crypt ? 0.5 : 2.4;
  rim.intensity = crypt ? 1.2 : 1.6;
  torch.intensity = crypt ? 6 : 0;
  $('light').classList.toggle('on', crypt);
}
setLight();

let mixer, root, action, clips = [], current = -1, playing = true;
const clock = new THREE.Clock();

new GLTFLoader().load(MODEL, (gltf) => {
  root = gltf.scene;
  window.brute = root;            // handy from the console
  let tris = 0, bones = 0;
  root.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
      tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
    }
    if (o.isBone) bones++;
  });
  scene.add(root);
  mixer = new THREE.AnimationMixer(root);
  // two-handed and one-handed maul clips first, then the rest alphabetically
  clips = gltf.animations.slice().sort((a, b) =>
    (b.name.startsWith('TwoHand') - a.name.startsWith('TwoHand')) || (b.name.startsWith('Maul') - a.name.startsWith('Maul')) || a.name.localeCompare(b.name));
  $('stats').textContent = `${Math.round(tris).toLocaleString()} triangles · ${bones} bones · ${clips.length} clips`;
  buildList();
  setWeapon();
  const start = clips.findIndex((c) => c.name === 'TwoHand_Idle_Loop');
  play(start >= 0 ? start : 0);
  $('msg').remove();
}, (e) => { if (e.total) $('msg').textContent = `Loading zombie… ${Math.round(e.loaded / e.total * 100)}%`; },
(err) => { $('msg').textContent = 'Could not load ' + MODEL + ' — ' + err.message; });

function buildList() {
  const ul = $('clips'); ul.innerHTML = '';
  const f = $('filter').value.toLowerCase();
  clips.forEach((c, i) => {
    if (f && !c.name.toLowerCase().includes(f)) return;
    const li = document.createElement('li');
    li.innerHTML = `${c.name.replace(/_/g, ' ')} <small>${c.duration.toFixed(1)}s</small>`;
    li.dataset.i = i;
    li.className = i === current ? 'on' : '';
    li.onclick = () => play(i);
    ul.appendChild(li);
  });
}

function play(i) {
  if (!mixer || i < 0 || i >= clips.length) return;
  const next = mixer.clipAction(clips[i]);
  next.reset().setLoop(THREE.LoopRepeat).play();
  if (action && action !== next) action.crossFadeTo(next, 0.25, false);
  action = next; current = i;
  setWeapon();                       // Maul_* clips swing the choked one-handed maul
  setPlaying(true);
  for (const li of $('clips').children) li.classList.toggle('on', +li.dataset.i === i);
  $('clips').querySelector('.on')?.scrollIntoView({ block: 'nearest' });
}

function setPlaying(p) {
  playing = p; $('play').textContent = p ? 'Pause' : 'Play';
}

$('play').onclick = () => setPlaying(!playing);
$('rest').onclick = () => {
  mixer?.stopAllAction(); action = null; current = -1;
  root?.traverse((o) => { if (o.isSkinnedMesh) o.skeleton.pose(); });
  for (const li of $('clips').children) li.classList.remove('on');
};
$('speed').oninput = () => { $('sv').textContent = (+$('speed').value).toFixed(1) + '×'; };
$('scrub').oninput = () => {
  if (!action) return;
  setPlaying(false);
  action.time = +$('scrub').value * action.getClip().duration;
  mixer.update(0);
};
$('spin').onclick = () => { controls.autoRotate = !controls.autoRotate; $('spin').classList.toggle('on', controls.autoRotate); };
$('light').onclick = () => { crypt = !crypt; setLight(); };
$('wire').onclick = () => {
  const on = !$('wire').classList.contains('on');
  $('wire').classList.toggle('on', on);
  root?.traverse((o) => { if (o.isMesh) [].concat(o.material).forEach((m) => { m.wireframe = on; }); });
};
$('filter').oninput = buildList;
function setWeapon() {
  const w = $('weapon').value;
  // the weapon itself only: its per-material pieces load as children named Weapon_Maul_1, _2 ...
  const clip = clips[current];
  const show = (w === 'Weapon_Maul' && clip && clip.name.startsWith('Maul_')) ? 'Weapon_MaulOneHand' : w;   // choked grip
  root?.traverse((o) => { if (/^Weapon_[A-Za-z]+$/.test(o.name)) o.visible = o.name === show; });
}
$('weapon').onchange = setWeapon;
for (const k of SKINS) $('skin').add(new Option(k.replace('brute_', '').replace(/_/g, ' '), k));
$('skin').value = MODEL.replace('.glb', '');
$('skin').onchange = () => { location.search = '?model=' + $('skin').value; };
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.code === 'ArrowDown' || e.code === 'ArrowRight') { e.preventDefault(); play((current + 1) % clips.length); }
  if (e.code === 'ArrowUp' || e.code === 'ArrowLeft') { e.preventDefault(); play((current - 1 + clips.length) % clips.length); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer && playing) mixer.update(dt * +$('speed').value);
  if (action) {
    const d = action.getClip().duration;
    if (playing) $('scrub').value = (action.time % d) / d;
    $('now').textContent = `${(action.time % d).toFixed(2)} / ${d.toFixed(2)} s`;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
