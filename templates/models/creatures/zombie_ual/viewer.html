<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undead Viewer</title>
<style>
  :root { --bg:#0d0f12; --panel:rgba(18,20,24,.88); --line:#2a2e35; --text:#d9d6cf; --dim:#8a877f; --hot:#b3242a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.35 system-ui, sans-serif; overflow:hidden; }
  canvas { display:block; }
  #side { position:fixed; top:12px; left:12px; bottom:12px; width:260px; display:flex; flex-direction:column; gap:8px;
          background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  h1 { font-size:15px; margin:0; letter-spacing:.04em; }
  #stats { color:var(--dim); font-size:12px; }
  #pick { display:flex; gap:6px; }
  #monster { flex:1; min-width:0; padding:6px 8px; background:#0b0c0f; border:1px solid var(--line); color:var(--text); border-radius:6px; font:inherit; }
  #filter { width:100%; padding:6px 8px; background:#0b0c0f; border:1px solid var(--line); color:var(--text); border-radius:6px; }
  #clips { flex:1; overflow:auto; margin:0; padding:0; list-style:none; border-top:1px solid var(--line); }
  #clips li { padding:5px 8px; cursor:pointer; border-radius:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #clips li.take { padding-left:22px; }
  #clips li:hover { background:#1d2027; }
  #clips li.on { background:var(--hot); color:#fff; }
  #clips li small { color:var(--dim); float:right; }
  #clips li.on small { color:#f3d0d0; }
  #bar { position:fixed; left:284px; right:12px; bottom:12px; display:flex; flex-wrap:wrap; align-items:center; gap:10px;
         background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  button { background:#1d2027; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:#4a505a; }
  button.on { background:var(--hot); border-color:var(--hot); color:#fff; }
  label { display:flex; align-items:center; gap:6px; color:var(--dim); }
  input[type=range] { accent-color:var(--hot); }
  #scrub { flex:1; min-width:140px; }
  #now { min-width:118px; font-variant-numeric:tabular-nums; color:var(--dim); }
  #msg { position:fixed; inset:0; display:grid; place-items:center; color:var(--dim); pointer-events:none; }
  @media (max-width: 720px) {
    #side { top:auto; bottom:64px; left:8px; right:8px; width:auto; height:38vh; }
    #bar { left:8px; right:8px; bottom:8px; }
  }
</style>
</head>
<body>
<div id="msg">Loading…</div>
<div id="side">
  <h1>UNDEAD — UAL2 rig</h1>
  <div id="pick">
    <button id="prev" title="[">‹</button>
    <select id="monster" aria-label="Monster"></select>
    <button id="next" title="]">›</button>
  </div>
  <div id="stats"></div>
  <input id="filter" placeholder="Filter clips…" autocomplete="off">
  <ul id="clips"></ul>
</div>
<div id="bar">
  <button id="play" title="Space">Pause</button>
  <button id="rest" title="Bind pose">Rest pose</button>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
  <span id="now">0.00 / 0.00 s</span>
  <label>Speed <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1"><span id="sv">1.0×</span></label>
  <button id="spin">Turntable</button>
  <button id="light">Crypt light</button>
  <button id="wire">Wireframe</button>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// every monster shares the UAL2 skeleton; the clips (with four extra takes of each zombie clip) live in one file
const MONSTERS = [
  ['zombie_ual', 'Zombie'], ['veinwretch', 'Veinwretch'], ['ropebound', 'Ropebound'], ['ancient', 'Ancient'],
  ['cinder', 'Cinder'], ['maw', 'Maw'], ['mummy', 'Mummy'], ['shambler', 'Shambler'], ['drowned', 'Drowned'],
  ['ghoul', 'Ghoul'], ['plague', 'Plague'],
];
const CLIPS = 'ual2_clips.glb';
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f12);
scene.fog = new THREE.Fog(0x0d0f12, 6, 14);
const env = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.02, 60);
camera.position.set(0.9, 1.45, 3.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true;
controls.minDistance = 0.3; controls.maxDistance = 9;

// two lighting moods: a neutral studio, and the game's dim crypt (warm torch key, cold rim)
const hemi = new THREE.HemisphereLight(0xc8cfdc, 0x2a2622, 1.0);
const key = new THREE.DirectionalLight(0xfff1dd, 2.4);
key.position.set(1.8, 3.2, 2.4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -1.5, right: 1.5, top: 2.4, bottom: -0.5, near: 0.5, far: 9 });
const rim = new THREE.DirectionalLight(0xa9c4ff, 1.6);
rim.position.set(-2.2, 2.4, -2.6);
const torch = new THREE.PointLight(0xff8a3a, 0, 6, 1.6);
torch.position.set(1.1, 1.7, 1.2); torch.castShadow = true;
scene.add(hemi, key, rim, torch);

const ground = new THREE.Mesh(new THREE.CircleGeometry(4, 64),
  new THREE.MeshStandardMaterial({ color: 0x1a1b1e, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

let crypt = false;
function setLight() {
  scene.environment = crypt ? null : env;
  hemi.intensity = crypt ? 0.18 : 1.0;
  key.intensity = crypt ? 0.5 : 2.4;
  rim.intensity = crypt ? 1.2 : 1.6;
  torch.intensity = crypt ? 6 : 0;
  $('light').classList.toggle('on', crypt);
}
setLight();

let mixer, root, action, clips = [], current = -1, playing = true, monster = -1, loadId = 0;
const clock = new THREE.Clock();
const loader = new GLTFLoader();

// base clips (zombie ones first), each followed by its takes _B.._E
function order(list) {
  const base = (n) => n.replace(/_[B-E]$/, '');
  return list.slice().sort((a, b) =>
    (base(b.name).startsWith('Zombie') - base(a.name).startsWith('Zombie')) ||
    base(a.name).localeCompare(base(b.name)) || a.name.localeCompare(b.name));
}

for (const [file, name] of MONSTERS) $('monster').add(new Option(name, file));

function dispose(obj) {   // phones: free the last monster before the next one arrives
  obj.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry.dispose();
    for (const m of [].concat(o.material)) {
      for (const v of Object.values(m)) if (v && v.isTexture) v.dispose();
      m.dispose();
    }
  });
}

async function show(i) {
  i = (i + MONSTERS.length) % MONSTERS.length;
  const id = ++loadId;
  const [file, name] = MONSTERS[i];
  $('monster').value = file;
  $('msg').textContent = `Loading ${name}…`;
  let gltf;
  try {
    gltf = await loader.loadAsync(file + '.glb', (e) => {
      if (e.total && id === loadId) $('msg').textContent = `Loading ${name}… ${Math.round(e.loaded / e.total * 100)}%`;
    });
  } catch (err) { $('msg').textContent = `Could not load ${file}.glb — ${err.message}`; return; }
  if (id !== loadId) { dispose(gltf.scene); return; }
  const keep = current >= 0 ? clips[current].name : 'Zombie_Walk_Fwd_Loop';
  if (root) { mixer.stopAllAction(); scene.remove(root); dispose(root); }
  root = gltf.scene; monster = i;
  let tris = 0, bones = 0;
  const wire = $('wire').classList.contains('on');
  root.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
      tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
      if (wire) [].concat(o.material).forEach((m) => { m.wireframe = true; });
    }
    if (o.isBone) bones++;
  });
  scene.add(root);
  mixer = new THREE.AnimationMixer(root); action = null;
  $('stats').textContent = `${name} · ${Math.round(tris).toLocaleString()} triangles · ${bones} bones · ${clips.length} clips`;
  $('msg').textContent = '';
  history.replaceState(null, '', '?m=' + file);
  const k = clips.findIndex((c) => c.name === keep);
  play(k >= 0 ? k : 0);
}

function buildList() {
  const ul = $('clips'); ul.innerHTML = '';
  const f = $('filter').value.toLowerCase();
  clips.forEach((c, i) => {
    if (f && !c.name.toLowerCase().includes(f)) return;
    const li = document.createElement('li');
    const take = /_[B-E]$/.test(c.name);
    li.innerHTML = `${take ? 'take ' + c.name.slice(-1) : c.name.replace(/_/g, ' ')} <small>${c.duration.toFixed(1)}s</small>`;
    li.title = c.name;
    li.dataset.i = i;
    li.className = (take ? 'take ' : '') + (i === current ? 'on' : '');
    li.onclick = () => play(i);
    ul.appendChild(li);
  });
}

function play(i) {
  if (!mixer || i < 0 || i >= clips.length) return;
  const next = mixer.clipAction(clips[i]);
  next.reset().setLoop(THREE.LoopRepeat).play();
  if (action && action !== next) action.crossFadeTo(next, 0.25, false);
  action = next; current = i;
  setPlaying(true);
  for (const li of $('clips').children) li.classList.toggle('on', +li.dataset.i === i);
  const ul = $('clips'), li = ul.querySelector('.on');   // keep the playing clip in view, inside the list only
  if (li) {
    const y = li.offsetTop - ul.offsetTop;
    if (y < ul.scrollTop || y + li.offsetHeight > ul.scrollTop + ul.clientHeight) ul.scrollTop = y - ul.clientHeight / 3;
  }
}

function setPlaying(p) {
  playing = p; $('play').textContent = p ? 'Pause' : 'Play';
}

$('monster').onchange = () => show(MONSTERS.findIndex(([f]) => f === $('monster').value));
$('prev').onclick = () => show(monster - 1);
$('next').onclick = () => show(monster + 1);
$('play').onclick = () => setPlaying(!playing);
$('rest').onclick = () => {
  mixer?.stopAllAction(); action = null; current = -1;
  root?.traverse((o) => { if (o.isSkinnedMesh) o.skeleton.pose(); });
  for (const li of $('clips').children) li.classList.remove('on');
};
$('speed').oninput = () => { $('sv').textContent = (+$('speed').value).toFixed(1) + '×'; };
$('scrub').oninput = () => {
  if (!action) return;
  setPlaying(false);
  action.time = +$('scrub').value * action.getClip().duration;
  mixer.update(0);
};
$('spin').onclick = () => { controls.autoRotate = !controls.autoRotate; $('spin').classList.toggle('on', controls.autoRotate); };
$('light').onclick = () => { crypt = !crypt; setLight(); };
$('wire').onclick = () => {
  const on = !$('wire').classList.contains('on');
  $('wire').classList.toggle('on', on);
  root?.traverse((o) => { if (o.isMesh) [].concat(o.material).forEach((m) => { m.wireframe = on; }); });
};
$('filter').oninput = buildList;
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'BracketLeft') show(monster - 1);
  if (e.code === 'BracketRight') show(monster + 1);
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.code === 'ArrowDown' || e.code === 'ArrowRight') { e.preventDefault(); play((current + 1) % clips.length); }
  if (e.code === 'ArrowUp' || e.code === 'ArrowLeft') { e.preventDefault(); play((current - 1 + clips.length) % clips.length); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer && playing) mixer.update(dt * +$('speed').value);
  if (action) {
    const d = action.getClip().duration;
    if (playing) $('scrub').value = (action.time % d) / d;
    $('now').textContent = `${(action.time % d).toFixed(2)} / ${d.toFixed(2)} s`;
  }
  controls.update();
  renderer.render(scene, camera);
});

try {
  clips = order((await loader.loadAsync(CLIPS)).animations);
} catch (err) { $('msg').textContent = 'Could not load ' + CLIPS + ' — ' + err.message; throw err; }
buildList();
const start = MONSTERS.findIndex(([f]) => f === (q.get('m') || (q.get('model') || '').replace(/\.glb$/, '')));
show(start >= 0 ? start : 1);
</script>
</body>
</html>
