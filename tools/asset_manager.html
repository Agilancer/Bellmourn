function art() {
  const list = S.art.filter((p) => match(p));
  let html = head('Source art', S.art.length, 'The painted sheets enemy models are built from (art/creatures). “Built into” matches the sheet to a model by name, or through a build tool whose README names the sheet.');
  const viaTools = (p) => {
    const outs = new Set();
    for (const text of Object.values(S.readmes || {})) if (text.includes(base(p)) || text.includes(stem(p))) for (const m of text.matchAll(/templates\/models\/creatures\/([\w-]+)/g)) outs.add('templates/models/creatures/' + m[1]);
    return [...S.models.values()].filter((m) => outs.has(dir(m.path)));
  };
  const into = (p) => { const st = stem(p), ms = [...new Set([...S.models.values()].filter((m) => m.stem.includes(st) || (st.length > 4 && st.includes(m.stem))).concat(viaTools(p)))]; return `<div class="chips">${ms.length ? ms.map((m) => `<span class="chip click gold" data-act="model" data-v="${esc(m.path)}">→ ${esc(m.file)}</span>`).join('') : '<span class="chip">no model by this name yet</span>'}</div>`; };
  for (const [d, l] of groupBy(list, dir)) html += `<div class="group-h"><b>${esc(d)}/</b><span class="gn">${l.length}</span></div>` + imageGrid(l, into);
  return list.length ? html : html + `<div class="empty">${S.art.length ? 'Nothing matches.' : `Nothing under art/creatures on <b>${esc(S.src.label)}</b>.${S.src.kind === 'github' ? ' If those sheets are only on your computer so far, use “Open local folder”.' : ''}`}</div>`;
}
function tools() {
  const list = S.tools.filter((t) => match(t.name, t.files));
  let html = head('Build tools', S.tools.length, 'The scripts in tools/creatures that make the models above (mostly headless Blender). What each writes is read from its README.');
  html += `<div class="grid wide">`;
  for (const t of list) {
    const readme = t.dir ? t.files.find((p) => /README\.md$/i.test(p)) : t.files[0];
    const text = readme ? S.readmes[readme] || '' : '';
    let blurb = '';
    if (t.dir) blurb = (text.split(/\n\s*\n/).map((s) => s.trim()).find((s) => s && !s.startsWith('#')) || '').replace(/`|\*\*?/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1');
    else blurb = ((/^\s*(?:"""|''')([\s\S]*?)(?:"""|''')/.exec(text) || /^((?:\s*#.*\n)+)/.exec(text) || [])[1] || '').replace(/^\s*#\s?/gm, '').trim();
    const outs = [...new Set([...text.matchAll(/templates\/models\/creatures\/([\w-]+)/g)].map((m) => m[1]))];
    html += `<div class="card" data-act="img" data-v="${esc(readme || '')}" style="cursor:${readme && S.src.web(readme) ? 'pointer' : 'default'}"><div class="body">
      <h3 class="mono">${esc(t.name)}${t.dir ? '/' : ''}</h3><div class="meta">${t.dir ? plural(t.files.length, 'file') : kb(S.files.get(t.files[0])?.size)}</div>
      <p class="meta" style="margin:8px 0 0;color:var(--text);opacity:.85">${esc(blurb.slice(0, 260))}${blurb.length > 260 ? '…' : ''}</p>
      ${outs.length ? `<div class="chips">${outs.map((o) => `<span class="chip gold">→ creatures/${esc(o)}</span>`).join('')}</div>` : ''}</div></div>`;
  }
  return html + '</div>';
}

// lazy images: model thumbnails, textures out of models, files
const io = new IntersectionObserver((ents) => {
  for (const e of ents) {
    if (!e.isIntersecting) continue;
    io.unobserve(e.target);
    const img = e.target, d = img.dataset;
    if (d.portrait) requestPortrait(img);
    else if (d.tex) { const t = S.textures.get(d.tex); if (t) texThumbURL(t).then((u) => { img.src = u; }).catch(() => img.nextElementSibling?.remove()); }
    else if (d.mimg) { const [path, name] = d.mimg.split('#'); const m = S.models.get(path), im = m?.head?.images.find((x) => x.name === name); if (im) { const ph = m.phoneHead?.images.find((x) => x.name === name); (ph ? modelImageURL(m, ph, true) : modelImageURL(m, im)).then((u) => { img.src = u; }); } }
    else if (d.img) img.src = S.src.url(d.img);
  }
}, { rootMargin: '400px' });
function hydrate(root) { root.querySelectorAll('img[data-portrait],img[data-tex],img[data-img],img[data-mimg]').forEach((i) => io.observe(i)); }
document.addEventListener('load', (e) => { if (e.target.tagName === 'IMG') e.target.classList.add('ok'); }, true);
document.addEventListener('error', (e) => { if (e.target.tagName === 'IMG') e.target.nextElementSibling?.classList.contains('spin') && e.target.nextElementSibling.remove(); }, true);

// ============================================================== the detail panel
const D = {};
function refList(refs, max = 40) {
  if (!refs?.length) return '<p class="meta">No game code names it.</p>';
  return `<ul class="refs">${refs.slice(0, max).map((r) => `<li class="${r.comment ? 'cm' : ''}">${refLink(r.file, r.line)}${esc(r.text)}</li>`).join('')}</ul>${refs.length > max ? `<p class="meta">…and ${refs.length - max} more.</p>` : ''}`;
}
function filesList(parts) {
  return `<ul>${parts.map((m) => `<li><code>${esc(m.path)}</code><br><span class="meta">${m.missing ? '<span style="color:var(--bad)">missing from the repo</span>' : `${kb(m.size)} · ${fileLinks(m.path)}`}</span>
    ${m.phone ? `<br><code>${esc(m.phone)}</code><br><span class="meta">phone copy · ${kb(m.phoneSize)} · ${fileLinks(m.phone)}</span>` : ''}</li>`).join('')}
    ${[...new Set(parts.map((m) => dir(m.path)))].flatMap((d) => [...S.files.keys()].filter((p) => dir(p) === d && /\.(html|md|json)$/i.test(p))).map((p) => `<li><code>${esc(p)}</code><br><span class="meta">${kb(S.files.get(p)?.size)} · ${fileLinks(p)}</span></li>`).join('')}</ul>`;
}
function clipChips(m) {
  const h = m?.head; if (!h) return '<p class="meta">Reading the model…</p>';
  if (!h.clips.length) return '<p class="meta">No clips in this file.</p>';
  return `<div class="clips">${h.clips.map((c) => `<span class="clip${S.clipUsed.get(c.name) ? ' used' : ''}" data-act="play" data-v="${esc(c.name)}">${esc(c.name)}<small>${c.dur.toFixed(2)}s</small></span>`).join('')}</div>`;
}
function texGrid(parts) {
  const out = [];
  for (const m of parts) for (const im of m.head?.images || []) {
    const t = S.textures.get(m.family + '|' + im.name);
    out.push(`<figure data-act="tex" data-v="${esc(m.family + '|' + im.name)}"><div class="thumb sq chk"><img data-mimg="${esc(m.path + '#' + im.name)}" alt=""><div class="spin"></div></div>
      <figcaption>${esc(im.name)}<br><span style="color:var(--faint)">${esc((t ? roleOf(t) : im.roles).join(', '))} · ${kb(im.len)}</span></figcaption></figure>`);
  }
  return out.length ? `<div class="texgrid">${out.join('')}</div>` : '<p class="meta">No textures read yet.</p>';
}
function statsKV(m) {
  const h = m.head; if (!h) return '';
  return `<div class="kv"><span>Triangles</span><span>${h.tris.toLocaleString()} · ${h.verts.toLocaleString()} verts</span><span>Bones</span><span>${h.bones}</span>
    <span>Materials</span><span>${h.mats.map((x) => `<code>${esc(x)}</code>`).join(', ') || '—'}</span>
    ${h.sockets.length ? `<span>Sockets</span><span>${h.sockets.map((x) => `<code>${esc(x)}</code>`).join(', ')}</span>` : ''}
    <span>Meshes</span><span>${h.meshes.length} · ${h.nodes} nodes</span>${h.ext.length ? `<span>Extensions</span><span class="mono">${esc(h.ext.join(', '))}</span>` : ''}</div>`;
}
function gearList(e) {
  const row = (hand, ids) => ids.map((id) => { const g = S.gear.get(id); return `<li style="display:flex;gap:10px;align-items:center;cursor:pointer" data-act="gear" data-v="${esc(id)}">
    <span class="thumb sq" style="width:44px;flex:none;border-radius:4px">${g?.model ? portraitImg([g.model]) : ''}</span>
    <span><b>${esc(g?.name || id)}</b> ${idChip(id)} <span class="chip">${hand === 'R' ? 'right hand' : 'left hand'}</span>${g?.missing ? ' ' + pill('missing') : ''}</span></li>`; }).join('');
  return `<ul>${row('R', e.R || [])}${row('L', e.L || [])}</ul><p class="meta">Finish: ${(e.finish || []).map((f) => `<code>${esc(f || 'base')}</code>`).join(', ')} (one is picked per spawn)</p>`;
}
const SKIPD = new Set(['kind', 'title', 'R', 'L', 'finish', 'body']);
function enemyInfo(e) {
  const m0 = e.parts[0], d = e.d || {};
  let html = `<div class="chips">${pill(e.status)}<span class="chip">${esc(FAMILIES[e.family]?.label || e.family)}</span>${e.kind ? `<span class="chip">${esc(e.kind)}</span>` : ''}${e.missing ? pill('missing') : ''}</div>
    <h2>${esc(e.title)}</h2><div class="kv"><span>Game ID</span><span>${idChip(e.gameId ?? e.id)} ${e.def?.line ? `<span class="meta">${refLink(e.def.file, e.def.line, `${e.def.list} · ${base(e.def.file)}:${e.def.line}`)}</span>` : e.def ? `<span class="meta">${esc(e.def.list)}</span>` : '<span class="meta">not in any game list</span>'}</span>`;
  if (e.composite) html += `<span>Built from</span><span><code>${esc(d.body.villager)}</code> + <code>${esc(d.body.armor)}_${esc(d.body.sex)}</code> armour${d.body.helm === false ? ', bareheaded' : ''}${d.body.casts ? `, casting like <code>${esc(d.body.casts)}</code>` : ''}, put together by sworn.js</span>`;
  for (const [k, v] of Object.entries(d)) if (!SKIPD.has(k) && v != null) html += `<span>${esc(k)}</span><span class="mono">${esc(typeof v === 'number' && v > 4096 ? '0x' + v.toString(16) : v?.sym || JSON.stringify(v).replace(/^"|"$/g, ''))}</span>`;
  html += '</div>';
  if (e.haunts?.length) html += `<h4>Where it spawns (HAUNTS)</h4><ul>${e.haunts.map((h) => `<li><code>${esc(h.key)}</code> · ${h.n} of ${h.of} draws${h.label ? `<br><span class="meta">${esc(h.label)}</span>` : ''}</li>`).join('')}</ul>`;
  if (e.R?.length || e.L?.length) html += `<h4>Carries</h4>${gearList(e)}`;
  if (m0) {
    html += `<h4>Clips${e.composite ? ` in ${esc(m0.file)} (the game adds its own at runtime)` : ''}</h4>${clipChips(m0)}`;
    html += `<h4>Textures</h4>${texGrid(e.parts)}`;
    html += `<h4>Files</h4>${filesList(e.parts)}`;
    for (const m of e.parts) html += `<h4>Inside ${esc(m.file)}</h4>${statsKV(m) || '<p class="meta">Reading…</p>'}`;
  }
  html += `<h4>Code that names it</h4>${refList(e.refs)}`;
  return html;
}
function modelInfo(m) {
  const refs = findRefs([m.file, ...m.users.flatMap((e) => e.gameId && e.gameId.length > 2 ? quoted(e.gameId) : [])]);
  return `<div class="chips">${m.users.map((e) => pill(e.status)).slice(0, 1).join('')}<span class="chip">${esc(FAMILIES[m.family]?.label || m.family)}</span></div>
    <h2 class="mono" style="font-family:var(--mono);font-size:18px">${esc(m.file)}</h2>
    <div class="kv"><span>Used by</span><span>${m.users.map((e) => `<span class="chip click gold" data-act="enemy" data-v="${esc(e.id)}">${esc(e.gameId ?? e.id)} · ${esc(e.title)}</span>`).join(' ') || '—'}</span></div>
    ${statsKV(m)}<h4>Clips</h4>${clipChips(m)}<h4>Textures</h4>${texGrid([m])}<h4>Files</h4>${filesList([m])}<h4>Code that names it</h4>${refList(refs)}`;
}
function gearInfo(g) {
  return `<div class="chips"><span class="chip">${esc(pretty(g.cat))}</span>${g.missing ? pill('missing') : ''}</div><h2>${esc(g.name)}</h2>
    <div class="kv"><span>Item ID</span><span>${idChip(g.id)} <span class="meta">templates/models/manifest.json</span></span><span>Set</span><span>${esc(g.item?.set || '—')}</span></div>
    <h4>Carried by</h4><div class="chips">${g.carriers.map((c) => `<span class="chip click gold" data-act="enemy" data-v="${esc(c.enemy.id)}">${esc(c.enemy.gameId)} · ${c.hand === 'R' ? 'right' : 'left'}</span>`).join('')}</div>
    <h4>Finishes</h4><div class="texgrid">${Object.entries(g.variants).map(([f, p]) => `<figure data-act="img" data-v="${esc(p)}"><div class="thumb sq chk"><img data-img="${esc(p)}" alt="" style="image-rendering:pixelated"></div><figcaption>${esc(f)}${g.finishes.has(f) ? ' ★' : ''}</figcaption></figure>`).join('')}</div>
    <p class="meta">★ a finish some carrier uses.</p>
    <h4>Files</h4><ul>${g.path ? [g.path, ...[...S.files.keys()].filter((p) => dir(p) === dir(g.path) && p !== g.path)].map((p) => `<li><code>${esc(p)}</code><br><span class="meta">${kb(S.files.get(p)?.size)} · ${fileLinks(p)}</span></li>`).join('') : '<li>Not in the manifest, so the game skips it.</li>'}</ul>
    <h4>Code that names it</h4>${refList(findRefs(quoted(g.id)))}`;
}
async function openDetail({ parts, info, clip, gear: g, img, hide = null }) {
  Object.assign(D, { parts, gear: g || null, finish: null, phone: false, clip, hide });
  $('#info').innerHTML = info; hydrate($('#info'));
  $('#vbar').innerHTML = ''; $('#vinfo').textContent = '';
  const dlg = $('#detail'); if (!dlg.open) dlg.showModal();
  $('#info').scrollTop = 0;
  if (img) { // a sprite: its GIFs instead of a 3D model
    V.token++; if (V.r) { viewerClear(); V.r.domElement.hidden = true; }
    $('#vmsg').textContent = ''; const box = $('#stageImg'); box.hidden = false; box.firstElementChild.src = S.src.url(img.first);
    $('#vbar').innerHTML = img.list.map((p) => `<button data-act="gif" data-v="${esc(p)}" class="${p === img.first ? 'on' : ''}">${esc(stem(p))}</button>`).join('');
    return;
  }
  if (V.r) V.r.domElement.hidden = false;
  if (!parts?.length || parts.some((m) => m.missing)) { V.token++; if (V.r) viewerClear(); $('#stageImg').hidden = true; $('#vmsg').textContent = 'No model file to show.'; return; }
  await viewerShow(parts, { clip });
}
function openEnemy(id, clip) {
  const e = S.enemies.get(id); if (!e) return;
  if (e.sprite) { const sp = e.sprite, list = [...sp.gifs, ...sp.pages]; return openDetail({ parts: [], info: enemyInfo(e) + spriteInfo(sp), img: { first: list[0], list } }); }
  openDetail({ parts: e.parts, info: enemyInfo(e), clip, hide: e.hide });
}
function spriteInfo(sp) {
  const d = sp.def;
  return `<h4>Sprite data</h4><div class="kv"><span>File</span><span>${refLink(sp.path, null, sp.path)}</span><span>Size class</span><span>${esc(d.size_class)} · ${esc(d.height_m)} m · ${esc(d.px_per_m)} px/m</span>
    <span>Animations</span><span>${Object.entries(d.anims || {}).map(([k, a]) => `<code>${esc(k)}</code> ${(a.frames || []).length}f`).join(', ')}</span><span>Atlas</span><span>${sp.pages.map((p) => `<code>${esc(base(p))}</code>`).join(', ')}</span></div>`;
}
function openModel(path, clip) { const m = S.models.get(path); if (m) openDetail({ parts: [m], info: modelInfo(m), clip }); }
function openGear(id) {
  const g = S.gear.get(id); if (!g) return;
  openDetail({ parts: g.model ? [g.model] : [], info: gearInfo(g), gear: g });
}

// a big image with what it is
async function openImage(url, title, capHTML, pixel = false) {
  const lb = $('#lightbox'), img = $('#lightbox .pic img');
  img.removeAttribute('src'); img.className = pixel ? 'px' : '';
  $('#lbcap').innerHTML = `<h3>${esc(title)}</h3><div class="meta" id="lbdims">loading…</div>${capHTML || ''}`;
  if (!lb.open) lb.showModal();
  img.onload = () => { const d = $('#lbdims'); if (d) d.textContent = `${img.naturalWidth} × ${img.naturalHeight} px`; };
  img.src = await url;
}
function openFileImage(p) {
  if (!p) return;
  if (!IMG.test(p)) { const w = S.src.web(p); if (w) window.open(w, '_blank', 'noopener'); return; }
  openImage(S.src.url(p), base(p), `<div class="meta">${kb(S.files.get(p)?.size)} · <span class="path">${esc(p)}</span> · ${fileLinks(p)}</div>`, /\.gif$|variants|_texture/i.test(p));
}
function openTexture(key) {
  const t = S.textures.get(key); if (!t) return;
  const u0 = t.uses[0];
  openImage(texFullURL(t), t.name, `<div class="meta">${esc(roleOf(t).join(', '))} · ${kb(u0.im.len)} ${esc(u0.im.mime)} inside the model${t.file ? ` · also a file: <span class="path">${esc(t.file)}</span> (${fileLinks(t.file)})` : ''}</div>
    <div class="meta" style="margin-top:6px">Material${t.mats.size > 1 ? 's' : ''}: ${[...t.mats].map((x) => `<code>${esc(x)}</code>`).join(', ') || '—'}</div>
    <div class="chips" style="margin-top:8px">${t.uses.map((u) => `<span class="chip click gold" data-act="model" data-v="${esc(u.m.path)}">${esc(u.m.file)}</span>`).join('')}</div>`);
}

// ============================================================== events
document.addEventListener('click', async (ev) => {
  if (ev.target.closest('a')) return;
  const t = ev.target.closest('[data-act]');
  if (!t || t.tagName === 'SELECT' || t.tagName === 'INPUT') return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case 'nav': UI.section = v; saveUI(); renderNav(); render(); window.scrollTo(0, 0); break;
    case 'copy': ev.stopPropagation(); try { await navigator.clipboard.writeText(v); toast(`Copied ${v}`); } catch { toast(v); } break;
    case 'enemy': $('#lightbox').close(); openEnemy(v); break;
    case 'model': $('#lightbox').close(); openModel(v); break;
    case 'gear': openGear(v); break;
    case 'tex': openTexture(v); break;
    case 'img': openFileImage(v); break;
    case 'clip': { const i = v.indexOf('|'); openModel(v.slice(0, i), v.slice(i + 1)); break; }
    case 'play': viewerPlay(v); break;
    case 'pause': V.playing = !V.playing; V.clock?.getDelta(); syncBar(); break;
    case 'wire': setWire(!V.wire); syncBar(); break;
    case 'bones': setBones(!V.bones); syncBar(); break;
    case 'home': if (V.home) { V.cam.position.copy(V.home.pos); V.ctl.target.copy(V.home.target); V.ctl.update(); } break;
    case 'phone': D.phone = !D.phone; viewerShow(D.parts, { clip: V.clip, phone: D.phone, finish: D.finish && D.gear?.variants[D.finish] }); break;
    case 'gif': $('#stageImg img').src = S.src.url(v); document.querySelectorAll('#vbar [data-act="gif"]').forEach((b) => b.classList.toggle('on', b === t)); break;
    case 'texrole': UI.texRole = v; render(); break;
    case 'local': pickFolder(); break;
    case 'close': t.closest('dialog').close(); break;
  }
});
document.addEventListener('change', (ev) => {
  const t = ev.target, a = t.dataset?.act;
  if (a === 'speed') V.speed = +t.value;
  else if (a === 'finish') { D.finish = t.value || null; viewerShow(D.parts, { clip: V.clip, phone: D.phone, finish: D.finish && D.gear.variants[D.finish] }); }
  else if (a === 'thumbs') { UI.thumbs = t.checked; saveUI(); if (UI.thumbs) render(true); }
});
for (const d of document.querySelectorAll('dialog')) d.addEventListener('click', (ev) => { if (ev.target === d) d.close(); });
$('#detail').addEventListener('close', () => { V.token++; if (V.r) viewerClear(); });
$('#q').addEventListener('input', (ev) => { UI.q = ev.target.value.trim().toLowerCase(); render(); });
$('#srcForm').addEventListener('submit', (ev) => { ev.preventDefault(); saveUI(); load(new GitHubSource($('#repo').value, $('#ref').value)); });
$('#localBtn').addEventListener('click', pickFolder);
document.addEventListener('keydown', (ev) => { if (ev.key === '/' && document.activeElement?.tagName !== 'INPUT' && !$('#detail').open) { ev.preventDefault(); $('#q').focus(); } });

renderNav();
load(new GitHubSource($('#repo').value, $('#ref').value));
</script>
</body>
</html>
